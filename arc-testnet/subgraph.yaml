specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ChamaDirectory
    network: arc-testnet
    source:
      address: "0x35e87026e77618fE9411F278f3870554aec6398f"
      abi: ChamaDirectory
      startBlock: 64486284
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Chama
        - Invite
        - JoinRequest
      abis:
        - name: ChamaDirectory
          file: ./abis/ChamaDirectory.json
      eventHandlers:
        - event: ChamaRegistered(indexed uint256,indexed address,address,string)
          handler: handleChamaRegistered
        - event: ChamaNameUpdated(indexed uint256,string)
          handler: handleChamaNameUpdated
        - event: InviteCreated(indexed bytes32,indexed uint256,uint256,uint256)
          handler: handleInviteCreated
        - event: InviteRevoked(indexed bytes32)
          handler: handleInviteRevoked
        - event: JoinRequested(indexed uint256,indexed address,indexed bytes32)
          handler: handleJoinRequested
        - event: JoinProcessed(indexed uint256,indexed address,bool)
          handler: handleJoinProcessed
        - event: ChamaStatusUpdated(indexed uint256,bool,bool)
          handler: handleChamaStatusUpdated
      file: ./src/directory.ts

templates:
  - kind: ethereum/contract
    name: ChamaLending
    network: arc-testnet
    source:
      abi: ChamaLending
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Chama
        - Loan
      abis:
        - name: ChamaLending
          file: ./abis/ChamaLending.json
      eventHandlers:
        - event: LoanRequested(indexed uint256,indexed address,uint256)
          handler: handleLoanRequested
        - event: LoanApprovalUpdated(indexed uint256,bool)
          handler: handleLoanApprovalUpdated
        - event: Guaranteed(indexed uint256,indexed address,uint256)
          handler: handleGuaranteed
        - event: LoanActivated(indexed uint256)
          handler: handleLoanActivated
        - event: Repaid(indexed uint256,uint256,uint256)
          handler: handleRepaid
        - event: Liquidated(indexed uint256,uint256,uint256)
          handler: handleLiquidated
      file: ./src/lending.ts
